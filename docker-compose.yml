name: resonance

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: resonance-app:latest
    command: ["node", "mcp/filesystem/server.mjs"]
    env_file:
      - path: .env
        required: false
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8792"
      MCP_ALLOWED_HOSTS: mcp,mcp:8792,localhost,127.0.0.1,127.0.0.1:8792
    volumes:
      - uploads:/app/uploads
      - analysis:/app/analysis
    expose:
      - "8792"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8792/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  trueforge:
    build:
      context: .
      dockerfile: Dockerfile.trueforge
    image: resonance-trueforge:latest
    environment:
      PORT: "8790"
      SQLITE_PATH: /data/trueforge.sqlite
    volumes:
      - trueforge-data:/data
    expose:
      - "8790"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/api/v1/capabilities').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 35s

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    image: resonance-app:latest
    command: ["node", "scripts/bootstrap.mjs"]
    env_file:
      - path: .env
        required: false
    environment:
      TRUEFORGE_BASE_URL: http://trueforge:8790
      MCP_URL: http://mcp:8792/mcp
      MCP_BASE_URL: http://mcp:8792
    depends_on:
      mcp:
        condition: service_healthy
      trueforge:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: resonance-app:latest
    command: ["npm", "start"]
    env_file:
      - path: .env
        required: false
    environment:
      TRUEFORGE_BASE_URL: http://trueforge:8790
      MCP_BASE_URL: http://mcp:8792
      MCP_URL: http://mcp:8792/mcp
      HOSTNAME: 0.0.0.0
      PORT: "43123"
    volumes:
      - uploads:/app/uploads
      - analysis:/app/analysis
    ports:
      - "127.0.0.1:43123:43123"
    depends_on:
      mcp:
        condition: service_healthy
      trueforge:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:43123/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  uploads:
  analysis:
  trueforge-data:
